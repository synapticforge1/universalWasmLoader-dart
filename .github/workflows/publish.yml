name: Publish

on:
  push:
    tags:
      - "v*"

# NOTE: The Actions policy only permits first-party (owner-owned) actions.
# Third-party `uses:` steps (actions/checkout, dart-lang/setup-dart, and the
# official dart-lang/setup-dart/.github/workflows/publish.yml reusable OIDC
# workflow) cause a `startup_failure` — the workflow never runs a single step.
# Every step here MUST therefore be a plain `run:` step: checkout via git
# clone, install the Dart SDK via run:, and publish via the `dart pub` CLI.
# Because the official pub.dev OIDC automated-publishing reusable workflow is
# off-limits, this uses a credentials-file approach instead (PUB_DEV_CREDENTIALS
# secret → pub-credentials.json), then `dart pub publish --force`.
#
# Two jobs, on purpose (workspace C30, owner 2026-11-07): `checks` runs every
# step that EXECUTES third-party package code (analyze, tests, the gate) with
# a read-only token and no secret. `publish` runs on a fresh runner and only
# the Dart SDK (with one dart:-only script); it is the only job that sees PUB_DEV_CREDENTIALS, so
# no dependency's code can run where the credentials are on disk.

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (the tag's commit, no token)
        # Full history + tags: the compatibility gate compares with the
        # previous release tag (scripts/compat.dart --release). The repository
        # is public, so the clone needs no token and none is stored in .git.
        run: |
          set -euo pipefail
          git clone --branch "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}" .
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" \
            || { echo "::error::tag ${{ github.ref_name }} no longer points at ${{ github.sha }}"; exit 1; }

      - name: Install Dart SDK
        run: |
          set -euo pipefail
          # Official Dart apt repository (Debian/Ubuntu). All plain `run:` — no
          # third-party action involved.
          sudo apt-get update
          sudo apt-get install -y apt-transport-https wget gnupg
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo "deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart
          echo "/usr/lib/dart/bin" >> "$GITHUB_PATH"

      - name: Show Dart version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Check fixtures match the reference stamp
        # Hard gate (unlike the browser tests): test/fixtures/ must be the -js
        # reference set, byte for byte (H7 / S4).
        run: dart run scripts/check_fixtures.dart

      - name: Test (best-effort, needs a browser)
        run: |
          set -euo pipefail
          # The package is web-only; its tests are `@TestOn('browser')` and need a
          # Chrome/Chromium. ubuntu-latest usually ships Chrome preinstalled, but we
          # do not hard-fail the publish if it is missing or the run errors.
          if command -v google-chrome >/dev/null 2>&1 \
            || command -v google-chrome-stable >/dev/null 2>&1 \
            || command -v chromium >/dev/null 2>&1 \
            || command -v chromium-browser >/dev/null 2>&1; then
            echo "Chrome found — running browser tests."
            dart test -p chrome || echo "::warning::dart test -p chrome failed; continuing to publish."
          else
            echo "::warning::No Chrome/Chromium on the runner — skipping browser tests."
          fi

      - name: Compatibility gate self-test
        run: dart run scripts/check_compat_gate.dart

      - name: Compatibility gate (blocking)
        # Hard gate (H6): the version raise since the previous tag must meet
        # the surface floor, api-surface.json must be current, and the previous
        # tag's tests must pass against this lib/ in Chrome for a patch/minor.
        run: dart run scripts/compat.dart --release

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the GitHub Release (POST /releases)

    steps:
      - name: Checkout (the tag's commit, no token)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}" .
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" \
            || { echo "::error::tag ${{ github.ref_name }} no longer points at ${{ github.sha }}"; exit 1; }

      - name: Install Dart SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https wget gnupg
          wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo "deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart
          echo "/usr/lib/dart/bin" >> "$GITHUB_PATH"

      # From here on, nothing runs a package's code: `dart pub publish`
      # downloads the dependencies to validate the package but does not execute
      # them (pub has no install scripts), and no `dart test` runs. The one
      # script, scripts/ci_release.dart, imports only `dart:` libraries and is
      # run from $RUNNER_TEMP, outside the package, so nothing is resolved.
      # No GitHub CLI (workspace H30): GitHub is reached through its REST API.

      - name: Stage the release script outside the package
        run: cp scripts/ci_release.dart "$RUNNER_TEMP/ci_release.dart"

      - name: Write pub.dev credentials
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${PUB_DEV_CREDENTIALS:-}" ]; then
            echo "::error::PUB_DEV_CREDENTIALS secret is empty. Generate it locally with \`dart pub login\` and copy the resulting pub-credentials.json into the repo secret. See README.md → Releasing."
            exit 1
          fi
          # On Linux, `dart pub` reads credentials from $PUB_CACHE if set, otherwise
          # from $XDG_CONFIG_HOME/dart/ (falling back to $HOME/.config/dart/).
          # Write to all candidate locations so the path is correct regardless of
          # the runner's default. The file is pub-credentials.json (newer SDKs);
          # older SDKs used credentials.json under $PUB_CACHE — write both names.
          umask 077
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then
            mkdir -p "$XDG_CONFIG_HOME/dart"
            printf '%s' "$PUB_DEV_CREDENTIALS" > "$XDG_CONFIG_HOME/dart/pub-credentials.json"
          fi
          mkdir -p "$HOME/.pub-cache"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          echo "Credentials written."

      - name: Publish to pub.dev
        # Skipped when pub.dev already has this version (workspace C34): pub.dev
        # never takes a version twice, so after a failure LATER in this job a
        # re-run would otherwise stop here and never reach the GitHub Release.
        run: |
          # Actions runs this with `bash -e`, so the exit code is caught with
          # `|| rc=$?`, never read after a bare failing command.
          set -euo pipefail
          rc=0
          ( cd "$RUNNER_TEMP" && dart run ci_release.dart pub-has "$GITHUB_WORKSPACE/pubspec.yaml" ) || rc=$?
          case "$rc" in
            0) echo "Already on pub.dev; nothing to upload." ;;
            3) dart pub publish --force ;;
            *) echo "::error::could not tell whether pub.dev has this version (exit $rc)"; exit 1 ;;
          esac

      - name: Remove pub.dev credentials
        if: always()
        run: |
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then rm -f "$XDG_CONFIG_HOME/dart/pub-credentials.json"; fi

      - name: Create GitHub Release (REST API)
        # Requires the tag to exist and peel to github.sha (POST /releases would
        # otherwise create a missing tag); an existing release is done, so a
        # re-run is safe; the new release is read back.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd "$RUNNER_TEMP" && dart run ci_release.dart github-release
