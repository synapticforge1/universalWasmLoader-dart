name: Publish

# 🔒 The owner's order (2026-11-10, workspace release-process.md § 5, D1):
# "the CI to check first, then push the tag, and then create the release page
# from the tag, then publish the package to the registry". A release is a push
# of `main` whose pubspec version has no tag yet: scripts/release.dart pushes
# the bump commit and NOTHING else; this workflow does the rest, in one run:
#
#   checks  (contents: read)   the gate on the pushed commit; "is this a release?"
#   tag     (contents: write)  CI's annotated tag v<version> on that commit
#   release (contents: write)  the GitHub Release page FROM the tag
#   publish (contents: read)   pub.dev, last; skip if published; fatal read-back
#
# A tag made with the job's GITHUB_TOKEN starts no workflow run, so tag, page
# and publish follow `needs:` in THIS run. Every other push of `main` runs
# `checks` alone. A failed release is finished with "Re-run failed jobs":
# each job skips what is already done (U12); a tag never moves.
#
# NOTE: The Actions policy only permits first-party (owner-owned) actions, so
# there is no `uses:` step: checkout is `git clone`, the Dart SDK is the
# official zip pinned by version AND sha256, GitHub is reached through its
# REST API (no GitHub CLI, workspace H30). pub.dev is published with a
# credentials file (PUB_DEV_CREDENTIALS), in ONE job that runs no package code
# and has a read-only token (C30).

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Dart SDK, pinned (U9). The sha256 is dart-archive's published sum, and was
  # re-hashed from the download on 2026-11-10 (238,850,892 bytes).
  DART_VERSION: "3.13.7"
  DART_SHA256: "eb99aed266efbcb615c6ae21c12f52cfe935b9f208bccc5fea7f64c21e867229"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.state.outputs.release }}
      tag: ${{ steps.state.outputs.tag }}

    steps:
      - name: Checkout (this commit, full history, no token)
        # Full history + tags: the compatibility gate compares with the
        # previous release tag. The repository is public, so the clone needs
        # no token and none is stored in .git.
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --detach "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Install Dart SDK (pinned by version + sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 3 -o "$RUNNER_TEMP/dartsdk.zip" \
            "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
          echo "${DART_SHA256}  $RUNNER_TEMP/dartsdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Is this push a release?
        # kind=new (v<version> not on GitHub), rerun (on this commit) or none.
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/ci_release.dart "$RUNNER_TEMP/ci_release.dart"
          ( cd "$RUNNER_TEMP" && dart run ci_release.dart state "$GITHUB_WORKSPACE/pubspec.yaml" )

      - name: Install dependencies
        run: |
          dart --version
          dart pub get

      - name: Analyze
        run: dart analyze

      - name: Check fixtures match the reference stamp
        # test/fixtures/ must be the -js reference set, byte for byte (H7 / S4).
        run: dart run scripts/check_fixtures.dart

      - name: Browser tests (blocking)
        # The package is web-only; its tests are @TestOn('browser') and need
        # Chrome, which ubuntu-latest ships. Missing Chrome fails the release.
        run: dart test -p chrome

      - name: Release script tests (blocking)
        # scripts/ci_release.dart against a mock GitHub / pub.dev.
        run: dart test -p vm test/ci_release_test.dart

      - name: Compatibility gate self-test
        run: dart run scripts/check_compat_gate.dart

      - name: Compatibility gate
        # A release: blocking, on the untagged candidate (H6, H33): the floor
        # since the previous tag, api-surface.json current, the previous tag's
        # tests green in Chrome for a patch / minor. An ordinary push: report.
        run: |
          if [ "${{ steps.state.outputs.release }}" = "true" ]; then
            dart run scripts/compat.dart --release
          else
            dart run scripts/compat.dart || echo "::warning::the compatibility report has problems; the next release must answer them"
          fi

      - name: Publish dry run
        if: steps.state.outputs.release == 'true'
        run: dart pub publish --dry-run

  tag:
    needs: checks
    if: needs.checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for git/tags + git/refs
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}

    steps:
      - name: Install Dart SDK (pinned by version + sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 3 -o "$RUNNER_TEMP/dartsdk.zip" \
            "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
          echo "${DART_SHA256}  $RUNNER_TEMP/dartsdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Fetch the release script alone (at github.sha, no checkout)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 --retry 3 \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci_release.dart" \
            -o "$RUNNER_TEMP/ci_release.dart"

      - name: Create the tag (REST API)
        # Annotated v<version> on github.sha; already there = done; on another
        # commit = refused; read back.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd "$RUNNER_TEMP" && dart run ci_release.dart tag

  release:
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the GitHub Release (POST /releases)
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}

    steps:
      - name: Install Dart SDK (pinned by version + sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 3 -o "$RUNNER_TEMP/dartsdk.zip" \
            "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
          echo "${DART_SHA256}  $RUNNER_TEMP/dartsdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Fetch the release script alone (at github.sha, no checkout)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 --retry 3 \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci_release.dart" \
            -o "$RUNNER_TEMP/ci_release.dart"

      - name: Create the GitHub Release page from the tag (REST API)
        # H32's order: the tag peels to github.sha; an existing page is done;
        # POST with generated notes and the pub.dev link; read back; peel again.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd "$RUNNER_TEMP" && dart run ci_release.dart github-release

  publish:
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}

    steps:
      - name: Checkout (this commit, no token)
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --detach "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Install Dart SDK (pinned by version + sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 3 -o "$RUNNER_TEMP/dartsdk.zip" \
            "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
          echo "${DART_SHA256}  $RUNNER_TEMP/dartsdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"

      # From here on, nothing runs a package's code: `dart pub publish`
      # downloads the dependencies to validate the package but does not execute
      # them (pub has no install scripts), and no `dart test` runs. The one
      # script, scripts/ci_release.dart, imports only `dart:` libraries and is
      # run from $RUNNER_TEMP, outside the package, so nothing is resolved.

      - name: Stage the release script outside the package
        run: cp scripts/ci_release.dart "$RUNNER_TEMP/ci_release.dart"

      - name: Write pub.dev credentials
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${PUB_DEV_CREDENTIALS:-}" ]; then
            echo "::error::PUB_DEV_CREDENTIALS secret is empty. Generate it locally with \`dart pub login\` and copy the resulting pub-credentials.json into the repo secret. See README.md → Releasing."
            exit 1
          fi
          # On Linux, `dart pub` reads credentials from $PUB_CACHE if set, otherwise
          # from $XDG_CONFIG_HOME/dart/ (falling back to $HOME/.config/dart/).
          # Write to all candidate locations so the path is correct regardless of
          # the runner's default. The file is pub-credentials.json (newer SDKs);
          # older SDKs used credentials.json under $PUB_CACHE — write both names.
          umask 077
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then
            mkdir -p "$XDG_CONFIG_HOME/dart"
            printf '%s' "$PUB_DEV_CREDENTIALS" > "$XDG_CONFIG_HOME/dart/pub-credentials.json"
          fi
          mkdir -p "$HOME/.pub-cache"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          echo "Credentials written."

      - name: Publish to pub.dev (skipped when pub.dev already has it)
        # pub.dev never takes a version twice: a re-run after a later failure
        # must skip the upload (C34).
        run: |
          # Actions runs this with `bash -e`, so the exit code is caught with
          # `|| rc=$?`, never read after a bare failing command.
          set -euo pipefail
          rc=0
          ( cd "$RUNNER_TEMP" && dart run ci_release.dart pub-has "$GITHUB_WORKSPACE/pubspec.yaml" ) || rc=$?
          case "$rc" in
            0) echo "Already on pub.dev; nothing to upload." ;;
            3) dart pub publish --force ;;
            *) echo "::error::could not tell whether pub.dev has this version (exit $rc)"; exit 1 ;;
          esac

      - name: Remove pub.dev credentials
        if: always()
        run: |
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then rm -f "$XDG_CONFIG_HOME/dart/pub-credentials.json"; fi

      - name: Read back from pub.dev (fatal)
        # A green upload is not proof: pub.dev must serve the version.
        run: cd "$RUNNER_TEMP" && dart run ci_release.dart pub-readback "$GITHUB_WORKSPACE/pubspec.yaml"
